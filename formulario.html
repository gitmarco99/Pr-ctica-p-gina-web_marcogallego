<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="estilos.css ">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULARIO</title>
</head>
<body>

<form>

  <label for="Nombre">Nombre: <input type="text" name="nombre" required></label><br>
  <br>
  <label for="Apellidos">Apellidos: <input type="text" name="Apellidos" required><label><br>
  <br>
  <label for="Direccion">Dirección: <input type="text" name="Direccion"></label><br>
  <br>
  <label for="Correo">Correo Electrónico: <input type="email" name="Correo" required></label><br>
  <br>
  <label for="Teléfono">Teléfono: <input type="tel" name="telefono"></label><br>
  <br>
  <label for="Nacimiento">Fecha de Nacimiento: <input type="date" name="nacimiento"></label><br>
  <br>
  <label for="Sexo">Sexo:
    <input type="radio" name="sexo" value="M"> Masculino
    <input type="radio" name="sexo" value="F"> Femenino
  </label><br>
<br>

  <label for="nombre ">Estado de la bicicleta:
    <br><input type="checkbox" name="bici_nueva"> Tienen que ser nuevas
    <br><input type="checkbox" name="bici_usada"> Pueden ser usadas
  </label><br>

 <br>
  <label for="nombre ">Observaciones:<br>
    <textarea name="observaciones" rows="4" cols="40"></textarea>
  </label><br>
<br>
  <button type="submit">Enviar</button>
</form>




<nav>
  <ul>
    <a href="index.html">REGRESAR AL INICIO</a>
  </ul>
</nav>
</body>
</html>
